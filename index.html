<script>
const pair=(zh,en)=>({zh,en});
const stages=[
 ['起步與一轉','Getting started','1–10','完成新手任務，離島後補到一轉。','Finish beginner quests, leave Maple Island, and get your first job.'],
 ['環島解任務','Around Victoria Island','10–20','以步行路線串起各城鎮，先接任務再打怪。','Connect the towns on foot. Accept quests before farming.'],
 ['二轉前的準備','Before the second job','20–30','組隊任務、化石、瑪亞與螞蟻洞一起推進。','Combine the party quest, fossils, Maya, and Ant Tunnel.'],
 ['二轉與任務收尾','Second job & loose ends','30–35','完成二轉，回各城交任務，再處理秘密之書。','Advance your job, finish pending quests, and recover the secret book.'],
 ['中期任務','Midgame quests','36–41','依等級推進娃娃、黃金海岸、共鳴與蓋房材料。','Work through dolls, Florina Beach, resonance, and house materials.'],
 ['命中足夠再回來','Return when accuracy is enough','41+','高等怪物先別硬打；PDF 建議 55 級、命中超過 104 再回頭。','Do not force fights with high-level monsters. The PDF suggests returning at level 55 with accuracy above 104.'],
 ['遺忘空洞','Forgotten Hollow','新區域 / New area','新區域各任務串；原稿未列最低等級。','New-area quest chains. The source gives no minimum level.']
].map((x,id)=>({id,title:pair(x[0],x[1]),range:x[2],intro:pair(x[3],x[4])}));
const towns=[['all','全部地區','All areas'],['island','楓之島','Maple Island'],['lith','維多利亞港','Lith Harbor'],['henesys','弓箭手村','Henesys'],['ellinia','魔法森林','Ellinia'],['perion','勇士之村','Perion'],['kerning','墮落城市','Kerning City'],['sleepy','奇幻村','Sleepywood'],['florina','黃金海岸','Florina Beach'],['hollow','遺忘空洞（暫譯）','Forgotten Hollow']];
const quests=[];
function q(stage,town,zh,en,pages,steps,notes=[],extra=false){quests.push({id:'q'+String(quests.length+1).padStart(2,'0'),stage,town,title:pair(zh,en),pages,steps:steps.map(x=>pair(...x)),notes:notes.map(x=>pair(...x)),extra});}
q(0,'island','完成新手任務，8 級離島','Finish beginner quests; leave at level 8',[2],[
 ['先完成楓之島（Maple Island）的新手任務。8 級搭船前往維多利亞港（Lith Harbor），不用一直留在島上練等。','Complete the beginner quests on Maple Island. At level 8, sail to Lith Harbor instead of staying on the island to grind.'],
 ['貼文提到瑞恩的冒險問答有改題目，但沒有附答案；網站不補猜測答案。','The transcript says the beginner adventure quiz has changed, but supplies no answers. No guessed answers are added here.']]);
q(0,'lith','奧拉夫與特奧：第一輪訓練','Olaf & Teo: first training round',[2],[
 ['找奧拉夫（Olaf）接第一次訓練，找特奧（Teo）接奇怪的嗜好。','Accept Olaf\'s First Training from Olaf and Teo\'s Weird Hobby from Teo.'],
 ['前往維多利亞港郊外（Right Around Lith Harbor）與海岸草叢 I（Thicket Around the Beach I）：打 10 隻綠水靈、8 隻木妖，收集 1 個綠水靈珠。','Visit Right Around Lith Harbor and Thicket Around the Beach I. Defeat 10 Slimes and 8 Stumps; collect 1 Slime Bubble.'],
 ['回港口交任務，接第二輪。','Return to the harbor, turn in both quests, and accept the next round.']]);
q(0,'lith','第二輪訓練與一轉','Second training round & first job',[2],[
 ['接奧拉夫的第二次訓練與特奧更奇怪的嗜好。到海岸草叢 II（Thicket Around the Beach II）打 8 隻菇菇寶貝與 10 隻肥肥，收集 1 個肥肥頭。','Accept Olaf\'s Second Training and Teo\'s Even Weird Hobby. In Thicket Around the Beach II, defeat 8 Orange Mushrooms and 10 Pigs; collect 1 Pig\'s Head.'],
 ['回去交任務。PDF 建議不足 10 級時打綠水靈、肥肥補等級，順便保留水靈珠與肥肥頭。10 級找菲爾（Phil）完成 Phil\'s Call，再前往職業城鎮。','Turn in the quests. The PDF suggests grinding Slimes and Pigs to level 10 while keeping their drops. At level 10, complete Phil\'s Call and travel to your job town.'],
 ['一轉條件請看遊戲內教官說明；PDF 的 10 級路線不要當成每個職業的統一門檻。','Check your job instructor for the actual first-job requirements. The PDF\'s level-10 route is not a universal job requirement.']]);
q(1,'henesys','布魯斯與木工學徒','Bruce & the woodworking apprentice',[3],[
 ['找布魯斯（Bruce）接研究菇菇的理由（The Reason Behind the Mushroom Studies），找維修斯（Vicious）接學徒任務。','Accept The Reason Behind the Mushroom Studies from Bruce and Vicious in Need of an Apprentice from Vicious.'],
 ['弓箭手訓練場 I（Henesys Hunting Ground I）：打 20 隻菇菇仔、20 隻菇菇寶貝、30 隻木妖；收集 10 個菇菇孢子、20 根樹枝。菇菇寶貝傘先留 40 個，包含後續用量。','At Henesys Hunting Ground I, defeat 20 Shrooms, 20 Orange Mushrooms, and 30 Stumps. Collect 10 Mushroom Spores and 20 Tree Branches. Keep 40 Orange Mushroom Caps, including later uses.'],
 ['回城交任務。需要練等時繼續打木妖與綠水靈；綠水靈珠後續合計需要 13 個。空屋（An Empty House）的菇菇寶貝可順便收集鑽石母礦。','Turn in the quests. Grind Stumps and Slimes if needed; later steps use 13 Slime Bubbles in total. Orange Mushrooms in An Empty House can also drop Diamond Ore.']],[
 ['NPC 對照有差異：貼文稱木工 NPC 為「比修斯」，PDF 使用 Vicious；英文定位以 PDF 為準。','NPC names differ: the transcript uses a different Chinese name for the woodworker. The PDF identifies him as Vicious.']]);
q(1,'henesys','13 級：找女兒與公民前置','Level 13: daughter & citizenship intro',[3],[
 ['找布魯斯接尋找女兒 1（I Need to Find My Daughter 1）。到市政廳（Town Hall）找亞瑟（Arthur），完成 To Henesys, the Prairie Town，再接 To the Gray City, Kerning City。','Accept I Need to Find My Daughter 1 from Bruce. Speak to Arthur in Town Hall, complete To Henesys, the Prairie Town, then accept To the Gray City, Kerning City.'],
 ['想加入弓箭手村公民系統，就在此加入並做公告欄（Community Board）的打招呼、找人任務；想加入墮落城市則先保留後續。每週捐獻不在這份路線內。','If choosing Henesys citizenship, join here and do the Community Board introductions. If choosing Kerning City, keep the follow-up. Weekly donations are outside this guide.']]);
q(1,'henesys','自由市場送信','Free Market letters',[3,4],[
 ['13 級到自由市場找劉易斯（Lewis），接 Welcome to the Free Market!。送信給長老斯坦（Chief Stan），回找劉易斯，再接 Asking Perion for Help。','At level 13, accept Welcome to the Free Market! from Lewis. Deliver the letter to Chief Stan, return to Lewis, and accept Asking Perion for Help.'],
 ['到勇士之村把信送給武術教練（Dances with Balrog），再回自由市場找劉易斯完成。','Deliver the letter to Dances with Balrog in Perion, then return to Lewis in the Free Market.'],
 ['貼文記錄整串獎勵：1,680 經驗、1,520 楓幣、20 瓶藍色藥水，並提到藍色鑰匙；數值與鑰匙用途需以遊戲為準。','The transcript reports 1,680 EXP, 1,520 mesos, and 20 Blue Potions for the chain, and also mentions a blue key. Verify the rewards and key in-game.']]);
q(1,'henesys','12 級：可選的迷你遊戲任務','Level 12: optional minigame quests',[3],[
 ['PDF 提到 12 級可接五子棋製作任務，依需求決定是否做；沒有提供所需材料。','The PDF lists an optional level-12 Omok crafting quest but does not provide its materials.'],
 ['貼文另提記憶卡任務：到弓箭手村公園最右邊找凱西，先接任務再收集 15 張怪物卡。卡片、棋盤、棋子被描述為任務道具，未接任務時不會掉。','The transcript also describes a Match Cards quest: speak to Casey at the far right of Henesys Park, accept it, then collect 15 Monster Cards. It says cards, boards, and pieces are quest drops, available only while the quest is active.']],[['記憶卡不是 PDF 的五子棋任務；英文名稱為說明翻譯，請核對遊戲。','Match Cards and the PDF\'s Omok quest are separate. The English description of the transcript-only quest is a translation; check in-game.']],true);
q(1,'sleepy','先買礦泉水，接製作前置','Pick up Pure Water & crafting intro',[3],[
 ['帶 1 張弓箭手村回城卷與至少 1,620 楓幣，再走到奇幻村（Sleepywood）。找克里斯拉瑪（Chrishrama）接 Chrishrama in Need of an Apprentice。','Bring a Henesys Return Scroll and at least 1,620 mesos, then walk to Sleepywood. Accept Chrishrama in Need of an Apprentice.'],
 ['進普通桑拿房（Regular Sauna）找豪素夫（Mr. Sweatbottom）買 1 瓶礦泉水（Pure Water）。預算夠可多買奇幻村回城卷。之後用回城卷或步行前往魔法森林。','Enter the Regular Sauna and buy 1 Pure Water from Mr. Sweatbottom. If affordable, buy a Sleepywood Return Scroll too. Walk or use a scroll toward Ellinia.']],[['貼文建議晚點到奇幻村，並寫入場 499 楓幣；PDF 是準備總預算 1,620 楓幣，兩者不是同一項費用。','The transcript visits Sleepywood later and quotes a 499-meso entry fee. The PDF gives a 1,620-meso preparation budget, which is not the same fee.']]);
q(1,'ellinia','作業與裁縫前置','Homework & tailoring intro',[4],[
 ['找妖精維英（Wing the Fairy）接 I Need Help on My Homework!，找弗朗索瓦（Francois）接學徒任務。','Accept I Need Help on My Homework! from Wing the Fairy and Francois in Need of an Apprentice from Francois.'],
 ['魔法森林南郊（The Field South of Ellinia）：打 30 隻黑木妖，收集 30 片葉子、3 個綠水靈珠；黏液先保留 52 個，含後續用量。回城交任務。','At The Field South of Ellinia, defeat 30 Dark Stumps; collect 30 Leaves and 3 Slime Bubbles. Keep 52 Squishy Liquids, including later uses. Return to town and turn in the quests.'],
 ['不到 14 級可繼續打黑木妖與綠水靈，保留鋼鐵母礦、石榴石母礦及水靈珠；後面另外還需要 10 個水靈珠。','If below level 14, keep fighting Dark Stumps and Slimes. Save Iron Ore, Garnet Ore, and Slime Bubbles; another 10 bubbles are needed later.']],[['貼文把裁縫 NPC 寫成伊德、作業 NPC 寫成妖精瑪瑙／唯音；PDF 使用 Francois、Wing the Fairy。','The transcript uses different NPC names for tailoring and homework. The PDF uses Francois and Wing the Fairy.']]);
q(1,'ellinia','14 級：賽恩的兩道菇菇料理','Level 14: Shane\'s mushroom recipes',[4],[
 ['找賽恩（Shane）接 How to Enjoy Mushrooms。到智慧森林（The Forest of Wisdom）打 30 隻綠菇菇、收集 15 個綠菇菇傘；回去交掉後再接下一道。','Accept How to Enjoy Mushrooms from Shane. In The Forest of Wisdom, defeat 30 Green Mushrooms and collect 15 Green Mushroom Caps. Turn it in before accepting the follow-up.'],
 ['接 How to Enjoy Mushrooms Even More，再打 30 隻綠菇菇、收集 15 個傘，回魔法森林買 1 個檸檬交任務。可到大木林 II（The Tree That Grew II）補足剩下 10 個綠水靈珠。','Accept How to Enjoy Mushrooms Even More. Defeat another 30 Green Mushrooms, collect 15 caps, and buy 1 Lemon in Ellinia for the turn-in. Farm the remaining 10 Slime Bubbles at The Tree That Grew II.'],
 ['貼文記錄第一道給 5 個青銅母礦、第二道給 5 個鋼鐵母礦，可用來解製作前置。此獎勵尚未實測。','The transcript reports 5 Bronze Ore from the first recipe and 5 Iron Ore from the second, usable for crafting introductions. These rewards have not been tested.']],[['PDF 的料理用量是 15＋15 個綠菇菇傘，後續再留 55 個；貼文的「扣掉 15 後還要 70」用途分配不同，不混算。','The PDF uses 15 + 15 Green Mushroom Caps here and reserves 55 later. The transcript\'s remaining-70 wording splits the uses differently; the totals are not merged.']]);
q(1,'perion','找女兒、修房子與兩種製作','Daughter, house repair & two crafts',[4,5],[
 ['找伊安（Ayan）交尋找女兒 1，接尋找女兒 2 與 The Stump Horror Story。找酋長（Blackbull）接 Fixing Blackbull\'s House。找西拉斯（Silas Irons）與雷先生（Mr. Thunder）各接學徒任務。','Turn in the first daughter quest to Ayan, then accept the second and The Stump Horror Story. Accept Fixing Blackbull\'s House from Blackbull and the apprentice quests from Silas Irons and Mr. Thunder.'],
 ['勇士之村東入口（Perion Street Corner）與東部岩山 I（East Rocky Mountain I）：打 30 隻木妖、20 隻黑木妖。PDF 建議樹枝留 122 根，含後續用途；準備 10 個青銅母礦、5 個鋼鐵母礦。','At Perion Street Corner and East Rocky Mountain I, defeat 30 Stumps and 20 Dark Stumps. The PDF reserves 122 Tree Branches including future uses; prepare 10 Bronze Ore and 5 Iron Ore.'],
 ['先找伊安、酋長、西拉斯交任務，再用鍛造台把 5 個青銅母礦做成 1 個青銅（Bronze Ingot，成品）、5 個鋼鐵母礦做成 1 個鋼鐵（Iron Ingot，成品），找雷先生交任務。','Turn in to Ayan, Blackbull, and Silas first. At the forge, make 1 Bronze Ingot from 5 Bronze Ore and 1 Iron Ingot from 5 Iron Ore, then turn in to Mr. Thunder.'],
 ['離開前繼續打黑木妖，額外留 65 片葉子、11 個石榴石母礦；打斧木妖收集 15 個木柴。','Before leaving, farm Dark Stumps for another 65 Leaves and 11 Garnet Ore. Collect 15 Firewood from Axe Stumps.']],[['貼文建議樹枝 42 根、葉子總數 105 片，修房子可先交 40 片；PDF 另列樹枝 122 根與不同階段葉子。這是兩套路線的備料量，不能當成已核對的總需求。','The transcript suggests 42 branches and 105 leaves, with 40 leaves for the first house repair. The PDF reserves 122 branches and lists leaves by stage. These are different route reserves, not verified combined totals.'],['貼文稱鍛造 NPC 為斯密斯；PDF 使用 Silas Irons。貼文記錄木妖任務給 171 經驗、292 楓幣、2 張回城卷；修房子盾牌機率為鋼盾 10%、木盾 90%，皆待遊戲確認。','The transcript names the smith differently; the PDF uses Silas Irons. It reports 171 EXP, 292 mesos, and 2 return scrolls for the Stump quest, plus house-repair shield odds of 10% steel / 90% wooden. Verify these in-game.']]);
q(1,'kerning','公民、伊卡路斯與製皮','Citizenship, Icarus & leatherworking',[5],[
 ['市政廳找蘿克西（Roxy）完成 To the Gray City, Kerning City。想加入墮落城市公民系統，可做公告欄打招呼與找人任務；每週捐獻另行安排。','Complete To the Gray City, Kerning City with Roxy in Town Hall. If choosing Kerning citizenship, do its Community Board introductions; plan weekly donations separately.'],
 ['找伊卡路斯（Icarus）完成 I\'m Bored 1、I\'m Bored 2。貼文提到用先前留下的黏液與樹枝交第二段；問答答案兩份都沒列，請直接看遊戲問題。','Complete I\'m Bored 1 and I\'m Bored 2 with Icarus. The transcript uses saved Squishy Liquids and Tree Branches for the second part. Neither source supplies the quiz answers.'],
 ['找後街吉姆（JM From tha Streetz）接製皮前置；找內拉（Nella）接 Don Hwang\'s Request，先準備 1,000 楓幣。','Accept JM From tha Streetz Looking for a Partner from JM and Don Hwang\'s Request from Nella. Prepare 1,000 mesos for Nella\'s quest.'],
 ['到墮落城市工地（Kerning City Construction Site）與 L Forest I：打 20 隻菇菇寶貝、30 隻肥肥、20 隻緞帶肥肥，收集 5 張動物皮，回城交任務。','At Kerning City Construction Site and L Forest I, defeat 20 Orange Mushrooms, 30 Pigs, and 20 Ribbon Pigs. Collect 5 Leather and turn in both quests.']]);
q(1,'kerning','內拉：休咪與安德烈的委託','Nella: Shumi & Andre',[5],[
 ['接 Shumi\'s Request，到 Sunset Sky 或 Construction Site North of Kerning City 打 25 隻黑木妖。回找內拉交掉，再接 Andre\'s Request。','Accept Shumi\'s Request. Defeat 25 Dark Stumps at Sunset Sky or Construction Site North of Kerning City. Turn it in to Nella before accepting Andre\'s Request.'],
 ['工地或隱藏地圖墮落主義（Caution Falling Down）：打 30 隻三眼章魚。觸角先留 80 個（20＋30＋30），含後續用量，回內拉交任務。','At the construction site or Caution Falling Down, defeat 30 Octopuses. Keep 80 Octopus Legs (20 + 30 + 30) including later uses, then return to Nella.'],
 ['貼文把此段描述成準備礦泉水與沙拉後交安德烈任務，獎勵攻擊手套；PDF 則在此交任務。材料與獎勵請核對任務視窗。','The transcript finishes Andre\'s request after buying Pure Water and Salad and reports attack gloves. The PDF turns it in here. Check the quest window for the actual items and rewards.']]);
q(1,'kerning','大水珠與製作解鎖收尾','Bubbling drops & crafting unlock',[5],[
 ['地鐵一號線第 1 區（Line 1 <Area 1>）打藍水靈，收集 20 個大水珠（Bubbling\'s Huge Bubble）。回奇幻村找克里斯拉瑪交學徒任務。','Farm Bubblings at Line 1 <Area 1> for 20 Bubbling\'s Huge Bubbles. Return to Chrishrama in Sleepywood to turn in the apprentice quest.'],
 ['貼文另描述：先接任務，打 30 隻黑木妖、收 1 個石榴石母礦後開啟加工，再做 1 個石榴石。這與 PDF 的藍水靈材料路線不同。','The transcript instead describes accepting the quest, defeating 30 Dark Stumps, collecting 1 Garnet Ore, unlocking processing, and making 1 Garnet. This differs from the PDF\'s Bubbling route.']],[['石榴石配方衝突：貼文寫 1 個母礦即可，PDF 後續備料是 11 個。不可照貼文假定正式版只要 1 個。','Garnet recipe conflict: the transcript says 1 ore is sufficient, while the PDF reserves 11 for later steps. Do not assume the live recipe takes only 1 ore.']]);
q(1,'henesys','打肥肥練到 21 級，保留材料','Farm Pigs toward level 21',[6],[
 ['豬的海岸（The Pig Beach）、弓箭手村東部草叢（The Rain-Forest East of Henesys）或西邊小山（A Hill West of Henesys）可練等；遠程職業可考慮西邊小山。','Level at The Pig Beach, The Rain-Forest East of Henesys, or A Hill West of Henesys. The PDF recommends the west hill for ranged jobs.'],
 ['這一段另收集 20 個肥肥頭、40 個蝴蝶結、35 個硬羽毛與 20 張動物皮。預算足可向玩家買肥肥頭。','For this segment, collect 20 Pig\'s Heads, 40 Pig\'s Ribbons, 35 Stiff Feathers, and 20 Leather. Buy Pig\'s Heads from players if affordable.']],[['貼文 30 級前備料是肥肥頭 10、蝴蝶結 50、動物皮 25、硬羽毛 20；PDF 此段不是全篇總數。製作與公民每週任務不包含在這些數量內。','The transcript\'s under-30 reserves are 10 heads, 50 ribbons, 25 Leather, and 20 feathers. The PDF amounts here are segment amounts, not whole-guide totals. Crafting and weekly donations are excluded.']]);
q(2,'henesys','20–21 級：先接城鎮任務','Levels 20–21: town quest pickups',[6],[
 ['先去墮落城市找阿勒斯（Alex）接 Alex\'s Request。回弓箭手村交布魯斯的尋找女兒 2。找明明女士（Mrs. Ming Ming）交第一個擔心，再接第二個擔心。','Accept Alex\'s Request in Kerning City. Return to Henesys, finish Bruce\'s second daughter quest, complete Mrs. Ming Ming\'s First Worry, and accept the second.'],
 ['找瑪亞（Maya）接 Maya and the Weird Medicine；找長老斯坦接 Talking to Stan。找維修斯製作 10 個加工木材（Processed Wood）。到迷宮入口找警衛路克（Luke）接 Luke the Security Guy。','Accept Maya and the Weird Medicine, then Talking to Stan from Chief Stan. Craft 10 Processed Wood with Vicious. Accept Luke the Security Guy at the dungeon entrance.']],[['這是 PDF 的建議接任務時點，並非最低等級：貼文在 15 級解明明第一段、18 級接阿勒斯、19 級接路克。若遊戲已開放可提早接。','This is the PDF\'s route timing, not the minimum level. The transcript starts Ming Ming at 15, Alex at 18, and Luke at 19; accept earlier if available in-game.']]);
q(2,'lith','簡、特奧與藍菇菇','Jane, Teo & Blue Mushrooms',[6],[
 ['維多利亞港找簡（Jane）接 Jane and the Mushroom；找特奧交任務、接 Finding Sophia。貼文稱簡的菇菇任務可在 20 級接，PDF 在 21 級後安排。','Accept Jane and the Mushroom in Lith Harbor. Speak to Teo and accept Finding Sophia. The transcript starts the mushroom quest at 20; the PDF schedules it after 21.'],
 ['藍菇菇森林（The Blue Mushroom Forest）：打 30 隻藍菇菇、收集 70 個藍菇菇傘。若皮亞（Pia）的任務已開放，先到弓箭手村公園接取。','At The Blue Mushroom Forest, defeat 30 Blue Mushrooms and collect 70 Blue Mushroom Caps. If Pia\'s quest is available, pick it up at Henesys Park first.'],
 ['魔法森林製作 1 個石榴石（Garnet），到南郊找胡小姐（Estelle）推進第二個擔心，取得特製醬油（Estelle\'s Special Sauce）。','Make 1 Garnet in Ellinia. Speak to Estelle in the south field to progress the second worry and obtain Estelle\'s Special Sauce.']],[['貼文表示皮亞任務可更早做，獎勵為三種頭盔命中卷軸隨機一種；PDF 在 30 級後統一交。','The transcript does Pia\'s quest earlier and reports a random helmet accuracy scroll from three options. The PDF batches the turn-in after level 30.']]);
q(2,'perion','化石與瑪亞的藥：先接再打','Fossils & Maya\'s medicine: accept first',[7],[
 ['東部岩山 II（East Rocky Mountain II）找溫斯頓博士（Winston）接 Searching for Fossils。在當地打 25 隻斧木妖、收集 12 個植物化石。','Accept Searching for Fossils from Winston at East Rocky Mountain II. Defeat 25 Axe Stumps there and collect 12 Plant Fossils.'],
 ['勇士之村找索菲亞（Sophia）接 Making a Sparkling Rock，找麥吉（Manji）接 Arcon\'s Blood?。','Accept Making a Sparkling Rock from Sophia and Arcon\'s Blood? from Manji in Perion.']],[['化石打法明顯衝突：貼文 17 級打綠菇菇／黑木妖；PDF 打斧木妖，動物化石在後續綠菇菇段收集。請以任務目標為準，不要直接照另一份刷。','Fossil targets conflict: the transcript uses Green Mushrooms / Dark Stumps at 17; the PDF uses Axe Stumps and collects Animal Fossils from Green Mushrooms later. Follow your quest window.']]);
q(2,'kerning','21–25 級：墮落城市組隊任務','Levels 21–25: Kerning Party Quest',[7],[
 ['找拉克里斯（Lakelis，PDF 拼法）接 Proof of Companionship。組隊任務至少擊敗一次超級綠水靈（King Slime）後交任務。','Accept Proof of Companionship from Lakelis (PDF spelling). Defeat King Slime at least once in the party quest, then turn it in.'],
 ['22 級找內拉接 Dr. Faymus\'s Request。PDF 利用獎勵關卡打 40 隻刺菇菇、25 隻綠菇菇，收集 55 個刺菇菇傘、55 個綠菇菇傘、12 個動物化石，並繼續練到 25 級。','At level 22, accept Dr. Faymus\'s Request from Nella. The PDF uses the bonus stage to defeat 40 Horny Mushrooms and 25 Green Mushrooms, collecting 55 caps of each and 12 Animal Fossils, then levels toward 25.'],
 ['無隊伍時先確認任務目標，再到一般地圖找同種怪物；兩份攻略都沒有保證這是單人替代路線。','If no party is available, check your quest targets before farming the same monsters on regular maps. Neither guide guarantees a complete solo substitute.'],
 ['貼文提醒王的跳躍約 450 傷害、碰撞超過 400；帶足補品並保持血量。獎勵描述為隨機耳環屬性卷軸。','The transcript reports about 450 jump damage and over 400 touch damage. Bring enough potions and keep your HP up. It describes a random earring stat scroll reward.']]);
q(2,'kerning','內拉第二輪：蛇皮、羽毛與動物皮','Nella round two: snakes, feathers & leather',[7],[
 ['到鱷魚潭 I／II（Dangerous Croko I / II）打 40 隻青蛇（Jr. Necki）、收集 30 張蛇皮。','At Dangerous Croko I / II, defeat 40 Jr. Neckis and collect 30 Jr. Necki Skins.'],
 ['回內拉交藥店委託，再推進 Chris\'s Request（硬羽毛、動物皮），接 Cutthroat Manny\'s Request。前面留的材料先不要賣。','Turn in the pharmacy request to Nella, progress Chris\'s Request using saved Stiff Feathers and Leather, then accept Cutthroat Manny\'s Request. Keep your earlier reserves.']]);
q(2,'kerning','23 級起：醫院陌生女子','From level 23: the hospital stranger',[7],[
 ['墮落城市醫院找陌生女子（Jane Doe）接 Stranger\'s Request。到地鐵轉乘區（Transfer Area）打 40 隻蝙蝠，收集 40 個蝙蝠翅膀與 20 個破鏡碎片。','Accept Stranger\'s Request from Jane Doe in the hospital. At Transfer Area, defeat 40 Stirges and collect 40 Stirge Wings and 20 Broken Mirror Glass.'],
 ['回去交任務，再接 Stranger\'s Identity；接好後才開始後續殭屍菇菇擊殺。','Turn it in and accept Stranger\'s Identity before starting the next Zombie Mushroom kills.']],[['貼文把 20 個碎片稱為「禁區碎片」，PDF 英文是 Broken Mirror Glass；以英文物品名定位。貼文下一段列 50 隻殭屍菇菇、25 張符咒。','The transcript uses a different Chinese name for the 20 fragments. The PDF calls them Broken Mirror Glass. The transcript lists 50 Zombie Mushrooms and 25 Charms of the Undead for the follow-up.']]);
q(2,'sleepy','螞蟻洞與火獨眼獸','Ant Tunnel & Evil Eyes',[7,8],[
 ['螞蟻洞 I–IV（Ant Tunnel I–IV）：PDF 合併打 75 隻殭屍菇菇、收集 65 張符咒（Charm of the Undead）。若掉落 Weighted Earrings，先保留化石研究會用到。','In Ant Tunnel I–IV, the PDF combines 75 Zombie Mushroom kills and 65 Charms of the Undead. Keep any Weighted Earrings for fossil research.'],
 ['練到能穩定命中火獨眼獸再去火獨眼獸洞 I（The Cave of Evil Eye I）。先到螞蟻洞廣場（Ant Tunnel Park）的 24 Hr Mobile Store 買 1 個沙拉，PDF 報價 220 楓幣。','When you can reliably hit Evil Eyes, head to The Cave of Evil Eye I. First buy 1 Salad at the 24 Hr Mobile Store in Ant Tunnel Park; the PDF quotes 220 mesos.'],
 ['打 50 隻火獨眼獸、收集 30 個尾巴；回螞蟻洞打刺菇菇與殭屍菇菇補到 30 級。把路克的材料帶回迷宮入口交任務。','Defeat 50 Evil Eyes and collect 30 Evil Eye Tails. Grind Horny Mushrooms and Zombie Mushrooms to level 30, then turn in Luke\'s quest at the dungeon entrance.']]);
q(2,'henesys','24 級起：卡蜜拉的寶石','From level 24: Camila\'s Gem',[9],[
 ['找卡蜜拉（Camila）接 Camila\'s Gem。從弓箭手村東部森林（The Forest East of Henesys）左上角進猶他的豬農場（Utah\'s Pig Farm），把玻璃珠交給猶他（Utah）。','Accept Camila\'s Gem. Enter Utah\'s Pig Farm through the upper-left of The Forest East of Henesys and give the glass marble to Utah.'],
 ['PDF 排在 30 級後；貼文寫 24 級可接，報告獎勵為 70% 得 30 個蛋糕、30% 得 25 級單手棍「花點」。英文裝備名未提供。','The PDF schedules it after 30; the transcript starts at 24 and reports 70% for 30 cakes or 30% for a level-25 one-handed blunt weapon. The English weapon name is not supplied.']],[['獎勵機率僅來自貼文，未經正式服實測。','Reward probabilities come only from the transcript and have not been tested on the live service.']]);
q(2,'sleepy','25 級：可選忍耐任務','Level 25: optional jump quest',[],[
 ['貼文補充：奇幻村找薩比特拉瑪接忍耐任務，前往魔法森林的忍耐地圖，完成可拿人氣與裝備卷軸。','Transcript supplement: accept the jump quest from Sabitrama in Sleepywood and complete the Ellinia jumping map for fame and an equipment scroll.'],
 ['PDF 明確排除忍耐任務，兩份資料都沒有逐平台跳法；本卡只記錄入口與獎勵描述。','The PDF excludes jump quests, and neither source gives platform-by-platform instructions. This card only records the entry and reported rewards.']],[['英文任務標題與地圖名稱未提供，請在遊戲核對。','The English quest title and exact map name were not supplied; check in-game.']],true);
q(2,'ellinia','15／25 級：可選製作進階','Levels 15 / 25: optional craft progression',[],[
 ['貼文：15 級、對應製作技能 2 級，才接第二階段。裁縫範例是製作 10 個線團、打 25 隻綠菇菇。','The transcript requires character level 15 and crafting skill level 2 for stage two. Its tailoring example crafts 10 thread bundles and defeats 25 Green Mushrooms.'],
 ['25 級、對應製作技能 5 級，且完成第二階段，才能接第三階段。貼文稱這是當時唯一催化劑來源；正式版是否相同尚未確認。','Stage three requires character level 25, crafting skill level 5, and the previous stage completed. The transcript calls it the only catalyst source at the time; this has not been confirmed for the live version.'],
 ['開荒不用為了解任務硬衝製作等級。PDF 只涵蓋首次解鎖，沒有完整製作或每週任務資料。','You do not need to force crafting levels just to clear quests while starting out. The PDF covers first unlocks only, not complete crafting or weekly tasks.']],[],true);
q(3,'perion','30 級：完成二轉','Level 30: second job advancement',[8],[
 ['找一轉導師接二轉任務，再找二轉教官進試煉，收集 30 個黑珠（Dark Marble）。','Accept the advancement quest from your first-job instructor. Enter the trial with the second-job instructor and collect 30 Dark Marbles.'],
 ['找二轉教官換英雄的證明（The Proof of a Hero），回一轉導師完成二轉。','Exchange them for The Proof of a Hero, then return to your first-job instructor to finish your second advancement.'],
 ['貼文稱四次對話共給 12,600 經驗（每次 3,150）。這是原攻略紀錄，非本站實測數據。','The transcript reports four conversations worth 3,150 EXP each, totaling 12,600. This is a source claim, not a tested result.']]);
q(3,'ellinia','化石研究：交箱子與植物樣本','Fossil research: box & plant samples',[8],[
 ['二轉後先處理職業城鎮任務；法師路線在魔法森林找艾溫（Arwen）接 Arwen and the Glass Shoe。貼文寫 29 級可接，PDF 30 級後安排。','After advancing, check your job town\'s quests. The mage example accepts Arwen and the Glass Shoe in Ellinia. The transcript says 29; the PDF schedules it after 30.'],
 ['找東部岩山 II 的溫斯頓交化石任務、接 Delivering a Box of Fossils。勇士之村找麥吉拿 Arcon\'s Blood、找索菲亞拿 Sparkling Rock。','Turn in the fossil quest to Winston and accept Delivering a Box of Fossils. Obtain Arcon\'s Blood from Manji and Sparkling Rock from Sophia in Perion.'],
 ['魔法森林找貝蒂（Betty）交箱子、接 Research on Plant Fossils。推薦魔法森林北部（The Forest North of Ellinia）收集 20 個植物樣本。','Deliver the box to Betty in Ellinia and accept Research on Plant Fossils. Collect 20 Plant Samples; the PDF recommends The Forest North of Ellinia.']],[['PDF 提醒樣本可能不好掉，人多時可能花半小時以上；這是二測經驗，不是保證耗時。','The PDF warns that samples can take over half an hour when crowded. This is a test-version experience, not a guaranteed duration.']]);
q(3,'henesys','安的問答與龍頭骨','Anne\'s quiz & the drake skull',[8],[
 ['向貝蒂交植物樣本後接 Research on Animal Fossils。到弓箭手村東邊小山（The Hill East of Henesys）找安（Anne），對話後接 Transporting Drake\'s Skull。','After turning in the plant samples, accept Research on Animal Fossils. Speak to Anne at The Hill East of Henesys, then accept Transporting Drake\'s Skull.'],
 ['問答順序：媽媽請我來找你 → 請我拿填充龍頭骨 → Betty → Ellinia → 紅色 → 藍色 → 黃色。下方保留英文選項，方便對照。','Answer in this order: the seven English choices below are retained exactly for easy in-game matching.'],
 ['1. Your mom asked me to see you\n2. She asked me to get a Stuffed Drake Skull from you\n3. Betty\n4. Ellinia\n5. Red\n6. Blue\n7. Yellow','1. Your mom asked me to see you\n2. She asked me to get a Stuffed Drake Skull from you\n3. Betty\n4. Ellinia\n5. Red\n6. Blue\n7. Yellow']]);
q(3,'henesys','說服長老斯坦：英文選項','Talking to Stan: English choices',[8,9],[
 ['回長老斯坦依序選以下六個選項，拿到金錶。接著找明明女士交任務，到弓箭手村公園找皮亞收尾。','Return to Chief Stan and choose the six answers below to receive the gold watch. Then finish the pending quests with Mrs. Ming Ming and Pia at Henesys Park.'],
 ['1. I\'m here on Alex\'s behalf. Just give me five minutes.\n2. Cut it out! Alex is sorry for running away!\n3. Why don\'t you ask Alex yourself?\n4. I think you are a great chief\n5. Alex\'s been unsettled since his mother passed away. Your strict nature hasn\'t helped him any. How about forgiving him?\n6. If you truly believe that, you should try to reconcile with him.','1. I\'m here on Alex\'s behalf. Just give me five minutes.\n2. Cut it out! Alex is sorry for running away!\n3. Why don\'t you ask Alex yourself?\n4. I think you are a great chief\n5. Alex\'s been unsettled since his mother passed away. Your strict nature hasn\'t helped him any. How about forgiving him?\n6. If you truly believe that, you should try to reconcile with him.'],
 ['意思依序是：替阿勒斯來，請給五分鐘 → 他已為離家後悔 → 直接問他 → 你是好長老 → 媽媽過世讓他不安，請原諒他 → 試著和好。','The sequence asks for five minutes, explains Alex\'s regret, suggests asking him directly, praises Stan, explains Alex\'s grief, and urges reconciliation.']]);
q(3,'lith','瑪亞的藥與城鎮交件','Maya\'s medicine & town turn-ins',[9],[
 ['維多利亞港找簡交菇菇任務，再找特奧交材料拿奇怪的藥，回弓箭手村找瑪亞完成。30 級可繼續 Maya\'s First Collection。','Turn in Jane\'s mushroom quest in Lith Harbor and obtain the Weird Medicine from Teo. Return to Maya in Henesys, then progress Maya\'s First Collection at level 30.'],
 ['貼文列瑪亞第一次收集：四種菇菇傘各 20 個，給橘色藥水；第二次：蝴蝶結、大水珠、火肥肥牙、桌布各 20 個，給藍色藥水。先保留，後續跑圖可一起收。','The transcript lists the first collection as 20 of each of four mushroom-cap types for Orange Potions; the second uses 20 each of Pig\'s Ribbon, Bubbling\'s Huge Bubble, Fire Boar\'s Tooth, and Tablecloth for Blue Potions. Save these while traveling.'],
 ['墮落城市找阿勒斯、陌生女子與內拉交剩餘任務。阿勒斯給的 Weighted Earrings 先別賣。','Finish pending turn-ins with Alex, Jane Doe, and Nella in Kerning City. Keep Weighted Earrings if Alex rewards them.']],[['貼文記錄瑪亞藥任務整串 14,693 經驗、4,113 楓幣與褐色斗笠；簡給隨機全職業武器卷軸。PDF 沒有核對這些獎勵。','The transcript reports 14,693 EXP, 4,113 mesos, and a brown bamboo hat for Maya\'s medicine chain, plus a random weapon scroll from Jane. The PDF does not verify these rewards.'],['四種菇菇傘的名稱在貼文沒有逐一列出；以遊戲需求確認，不自行補成確定清單。','The transcript does not explicitly name all four cap types; check the actual quest requirements.']]);
q(3,'ellinia','化石成果：耳環與木妖眼淚','Fossil results: earrings & Stump\'s Teardrop',[9],[
 ['向貝蒂交龍頭骨後接 Progress on Fossil Research。東部岩山 V（East Rocky Mountain V）打黑斧木妖收集 1 個木妖的眼淚，順便保留古木樹液。','Deliver the skull to Betty and accept Progress on Fossil Research. Farm Dark Axe Stumps at East Rocky Mountain V for 1 Stump\'s Teardrop; save Sap of Ancient Tree too.'],
 ['PDF 指定 Weighted Earrings：先檢查阿勒斯任務獎勵或殭屍菇菇掉落。有需要可花 9,000 楓幣在魔法森林武器店買；沒錢就晚點交。依序找溫斯頓與貝蒂收尾。','The PDF specifies Weighted Earrings. Check Alex\'s reward or Zombie Mushroom drops first. If needed, buy them in the Ellinia weapon shop for 9,000 mesos, or delay until affordable. Finish with Winston, then Betty.']],[['耳環名稱衝突：PDF 用 Weighted Earrings；貼文出現「垂耳環」並說阿勒斯可給鋼耳環／黃方耳環。不假設這些是同一物品，請看任務需求。','Earring names conflict: the PDF specifies Weighted Earrings; the transcript mentions other Chinese earring names and a different reward pair. Do not assume they are the same item.']]);
q(3,'perion','火肥肥、水晶鞋與 35 級','Fire Boars, glass shoe & level 35',[9],[
 ['火焰之地 II（The Burnt Land II）打火肥肥，收集艾溫的玻璃鞋、20 個火肥肥牙與 10 個鑽石母礦；繼續練到 35 級。','Farm Fire Boars at The Burnt Land II for Arwen\'s Glass Shoe, 20 Fire Boar\'s Teeth, and 10 Diamond Ore; continue toward level 35.'],
 ['PDF 建議鑽石母礦最好留到 30 個，後續製作會用；黑斧木妖也被列為來源。拿鞋回艾溫交任務。','The PDF recommends keeping up to 30 Diamond Ore for later crafting and lists Dark Axe Stumps as another source. Return the shoe to Arwen.']]);
q(3,'sleepy','35 級：秘密之書，先確認煉金 5 級','Level 35: secret book; alchemy level 5',[9,10],[
 ['PDF 指出這串需要煉金 5 級。奇幻村 VIP 桑拿房找豪素夫接 A Clue to the Secret Book。','The PDF requires alchemy level 5 for this chain. Accept A Clue to the Secret Book from Mr. Sweatbottom in the VIP Sauna in Sleepywood.'],
 ['魔法森林北部底端進北部森林通道（The Tree Tunnel At the Forest Up North）找洛尼（Ronnie），接 Hungry Ronnie。','Enter The Tree Tunnel At the Forest Up North from the bottom of The Forest North of Ellinia. Accept Hungry Ronnie from Ronnie.'],
 ['北部森林訓練場 IX（Tree Dungeon, Forest Up North IX）收集 50 個風獨眼獸尾巴。猴子森林 I（Monkey Forest I）打 50 隻猴子，留 85 根香蕉（30＋55）、30 個猴子娃娃。','At Tree Dungeon, Forest Up North IX, collect 50 Curse Eye Tails. At Monkey Forest I, defeat 50 Lupins and keep 85 bananas (30 + 55) and 30 Lupin Dolls.'],
 ['回洛尼交任務，接 Still Hungry Ronnie。','Turn in to Ronnie and accept Still Hungry Ronnie.']]);
q(3,'kerning','滑翔翼、熱氣球與桌布','Hang glider, balloon & tablecloths',[10],[
 ['找伊卡路斯完成 Icarus\'s Hang Glider，再接 Icarus and the Balloon。到絕望沼澤 I（The Swamp of Despair I）收集 10 個鱷魚皮革袋。','Complete Icarus\'s Hang Glider, then accept Icarus and the Balloon. Collect 10 Alligator Skin Pouches at The Swamp of Despair I.'],
 ['地鐵一號線第 2 區，或二號線第 1 區，打小幽靈（Jr. Wraith），收集 70 張桌布（Tablecloth）。找伊卡路斯交任務，再去弓箭手村找瑪亞交收集任務。','Farm Jr. Wraiths at Line 1 <Area 2> or Line 2 <Area 1> for 70 Tablecloths. Turn in to Icarus, then finish Maya\'s pending collection in Henesys.']]);
q(3,'ellinia','洛尼的餐點、牛奶與秘密之書','Ronnie\'s meal, milk & secret book',[10],[
 ['弓箭手村找麗娜（Rina）拿 Rina\'s Unagi Special，回洛尼交任務、接 Thirsty Ronnie。','Obtain Rina\'s Unagi Special in Henesys, return to Ronnie, and accept Thirsty Ronnie.'],
 ['魔法森林煉金台做 1 個鑽石（Diamond），找妖精羅雯（Rowen the Fairy）交任務拿 Fresh Milk。','Craft 1 Diamond at the Ellinia alchemy station and turn it in to Rowen the Fairy for Fresh Milk.'],
 ['回洛尼交任務、接 Returned Secret Book。奇幻村找豪素夫交書，另外買 1 瓶礦泉水，後續會用。','Return to Ronnie and accept Returned Secret Book. Deliver the book to Mr. Sweatbottom in Sleepywood and buy another Pure Water for later.']]);
q(4,'ellinia','36 級：詛咒娃娃，分段接任務','Level 36: Cursed Doll chain',[10],[
 ['命中夠再找妖精羅雯接 Cursed Doll 系列，推薦猴子沼澤 III（Monkey Swamp III）的殭屍猴。每段交掉、接下一段後再打。','When accuracy is sufficient, accept the Cursed Doll chain from Rowen. The PDF recommends Zombie Lupins at Monkey Swamp III. Turn in each stage and accept the next before farming.'],
 ['五段分別打 50／70／100／150／200 隻殭屍猴，收同樣數量的娃娃；本串合計 570 個，另外留 20 個後續用，合計備料 590 個。','The five stages require 50 / 70 / 100 / 150 / 200 Zombie Lupin kills and the same doll counts. That is 570 for the chain plus 20 for later, or 590 reserved in total.']]);
q(4,'florina','37 級：黃金海岸特產','Level 37: Special Taste of Florina Beach',[11],[
 ['黃金海岸（Florina Beach）找麗爾（Riel）接 Special Taste of Florina Beach 系列。','Accept the Special Taste of Florina Beach chain from Riel in Florina Beach.'],
 ['原稿合併四段備料：65 個椰子、100 個紅螃蟹鉗（Lorang Claw）、70 個青螃蟹鉗（Clang Claw）。依任務順序接取與繳交，原稿沒有列出每段分配。','The source combines four stages: 65 Coconuts, 100 Lorang Claws, and 70 Clang Claws. Accept and turn in the stages in order; the individual allocation is not supplied.']]);
q(4,'ellinia','39 級：悔恨之根與共鳴','Level 39: The Roots of Regret',[11],[
 ['找漢斯（Grendel the Really Old）接 The Roots of Regret。猴子森林打猴子收集 25 個發光魔法共鳴（Luminous Magical Resonance）。','Accept The Roots of Regret from Grendel the Really Old. Farm Lupins in Monkey Forest for 25 Luminous Magical Resonance.'],
 ['回漢斯接 A Fairy\'s Insight，找艾溫接 Tracing the Resonance。後續材料需打更高等怪物，先留待命中夠時處理。','Return to Grendel and accept A Fairy\'s Insight. Speak to Arwen and accept Tracing the Resonance. Later materials involve tougher monsters; leave them until accuracy is enough.']]);
q(4,'ellinia','41 級：洛尼蓋房材料 1、2','Level 41: Ronnie\'s house, deliveries 1 & 2',[11],[
 ['北部森林通道找洛尼接 First Material Delivery for Building a New House。北部森林訓練場 V 打 50 隻刺菇菇、收 30 個傘；IX 打 50 隻風獨眼獸、收 30 個尾巴。交掉後再接第二段。','Accept First Material Delivery for Building a New House from Ronnie. At Tree Dungeon V, defeat 50 Horny Mushrooms and collect 30 caps; at IX, defeat 50 Curse Eyes and collect 30 tails. Turn in before accepting delivery two.'],
 ['第二段：地鐵一號線第 1 區打 50 隻藍水靈、收 30 個大水珠；一號線第 2 區或二號線第 1 區打 50 隻小幽靈、收 30 張桌布。回洛尼交。','Delivery two: defeat 50 Bubblings at Line 1 <Area 1> and collect 30 huge bubbles; defeat 50 Jr. Wraiths at Line 1 <Area 2> or Line 2 <Area 1> and collect 30 Tablecloths. Return to Ronnie.']]);
q(4,'perion','41 級：蓋房材料 3 與最後一段','Level 41: house delivery 3 & final pickup',[11],[
 ['交完第二段後接 Third Material Delivery for Building a New House。東部岩山 VII 打 50 隻火肥肥、50 隻赤龍（Copper Drake），收 30 個火肥肥牙、30 個龍頭骨。','After turning in delivery two, accept Third Material Delivery for Building a New House. At East Rocky Mountain VII, defeat 50 Fire Boars and 50 Copper Drakes; collect 30 Fire Boar\'s Teeth and 30 Drake Skulls.'],
 ['回洛尼交任務，再接 Last Material Delivery for Building a New House。最後一段先保留，後面與高等材料一起收尾。','Turn in to Ronnie and accept Last Material Delivery for Building a New House. Keep it for the later high-level material route.']]);
q(5,'lith','先確認命中，再接簡的挑戰','Check accuracy; Jane\'s first challenge',[11,12],[
 ['這一區是高等怪物收尾，不表示 41 級就能完成。PDF 建議先到 55 級、命中超過 104 再回頭打巫婆、青龍、大幽靈；實際能力與職業仍須自己確認。','This section is a high-level cleanup, not a promise that it is completable at 41. The PDF suggests level 55 and accuracy above 104 before Maladies, Drakes, and Wraiths. Check your actual job and hit rate.'],
 ['維多利亞港找簡接 Jane\'s First Challenge。東部岩山 VII 打 50 隻赤龍、收 25 個龍頭骨；地鐵二號線第 3 區（Line 2 <Area 3>）打 50 隻大幽靈、收 25 個怪異的藥（Medicine With Weird Vibes）。','Accept Jane\'s First Challenge. At East Rocky Mountain VII, defeat 50 Copper Drakes and collect 25 Drake Skulls. At Line 2 <Area 3>, defeat 50 Wraiths and collect 25 Medicine With Weird Vibes.']]);
q(5,'lith','簡的第二次挑戰','Jane\'s Second Challenge',[12],[
 ['回簡交第一段、接第二段。巫婆森林 II（The Forest of Evil II）打 50 隻巫婆、收 25 個實驗青蛙（Malady\'s Experimental Frog）。','Turn in the first stage and accept Jane\'s Second Challenge. At The Forest of Evil II, defeat 50 Maladies and collect 25 Malady\'s Experimental Frogs.'],
 ['地鐵二號線第 3 區再打 50 隻大幽靈、收 105 個怪異的藥（25＋80，含後續）。到弓箭手村隱藏地圖別人的家（Someone Else\'s House）打菇菇王、拿菇菇王孢子；帶足補品，也可向玩家買。','At Line 2 <Area 3>, defeat another 50 Wraiths and collect 105 Medicine With Weird Vibes (25 + 80, including later uses). At Someone Else\'s House in Henesys, obtain a Mushmom Spore from Mushmom. Bring potions, or buy the item from a player.'],
 ['準備 3 個龍血（Drake\'s Blood）：可買，或到龍族獵場（Drake Hunting Ground）打 50 隻青龍收集。買材料是否能省略擊殺，仍要確認當前任務視窗。','Prepare 3 Drake\'s Blood by buying them or farming 50 Drakes at Drake Hunting Ground. Check whether your active quest still requires kills before assuming purchases skip the fight.']]);
q(5,'sleepy','簡的最後挑戰與共鳴材料','Jane\'s Final Challenge & resonance materials',[12],[
 ['回簡交第二段、接 Jane\'s Final Challenge。龍族獵場打 50 隻青龍，留 80 個龍鱗（20＋60）、55 個龍頭骨（25＋30），含後續用量。','Turn in stage two and accept Jane\'s Final Challenge. At Drake Hunting Ground, defeat 50 Drakes and reserve 80 Dragon Skins (20 + 60) and 55 Drake Skulls (25 + 30), including later uses.'],
 ['無光洞穴 I（The Tunnel That Lost Light I）或寺院入口（Another Path）：打 50 隻冰獨眼獸，留 60 個尾巴與 25 個腐爛樹根碎片。','At The Tunnel That Lost Light I or Another Path, defeat 50 Cold Eyes; keep 60 Cold Eye Tails and 25 Rotten Root Fragments.']]);
q(5,'ellinia','共鳴、月石與古木樹液','Resonance, Moon Rock & ancient sap',[12],[
 ['回魔法森林找艾溫推進共鳴，再找漢斯、洛尼交任務。原稿寫「煉金製作 1 個鑽石母礦」，可能與製作成品有混淆，請核對遊戲配方與任務需求。','Return to Arwen to progress resonance, then turn in with Grendel and Ronnie. The PDF says to craft 1 Diamond Ore at the alchemy station; this may confuse an ore with a refined gem. Verify the recipe and quest item.'],
 ['找艾溫製作 1 個月石（Moon Rock）。東部岩山 V 打 100 隻黑斧木妖、收 10 個古木樹液，回維多利亞港找簡完成挑戰。','Craft 1 Moon Rock with Arwen. At East Rocky Mountain V, defeat 100 Dark Axe Stumps and collect 10 Sap of Ancient Tree. Return to Jane in Lith Harbor to complete the challenge.']],[['原稿沒有提供月石配方，不另加未核對的礦石需求。','The source does not provide the Moon Rock recipe; no unverified ingredient list is added.']]);
q(5,'kerning','伊卡路斯披風與鱷魚任務 1','Icarus\'s cape & alligators, part 1',[12,13],[
 ['伊卡路斯接 In search of Wing the Fairy。魔法森林找維英接 The Ingredients for the Flying Medicine；勇士之村找伊安接 Taking Out the Alligators 1。','Accept In search of Wing the Fairy from Icarus. Get The Ingredients for the Flying Medicine from Wing in Ellinia, and Taking Out the Alligators 1 from Ayan in Perion.'],
 ['沼澤打魔女草（Witch\'s Herb）、收 20 片魔女草葉；打 40 隻青蛇、100 隻鱷魚，收 20 張蛇皮。','In the swamps, farm Witch\'s Herb for 20 Witchgrass Leaves; defeat 40 Jr. Neckis and 100 Ligators, collecting 20 Jr. Necki Skins.'],
 ['回維英交任務、接 Delivering the Flying Medicine；回伊安交第一段、接第二段；再找伊卡路斯交藥。','Turn in to Wing and accept Delivering the Flying Medicine. Finish Ayan\'s first stage and accept the second, then deliver the medicine to Icarus.']],[['PDF 說魔女草人多時可能耗時半小時以上，掉率未提供。','The PDF warns that Witch\'s Herb farming may take over half an hour when crowded; no drop rate is supplied.']]);
q(5,'perion','鱷魚任務 2 與酋長蓋新房','Alligators, part 2 & Blackbull\'s new house',[13],[
 ['鱷魚潭 II 打 120 隻黑鱷魚（Croco），收 50 張黑鱷魚皮。回伊安交任務，再找酋長接 Building a New House For Blackbull。','At Dangerous Croko II, defeat 120 Crocos and collect 50 Croco Skins. Turn in to Ayan, then accept Building a New House For Blackbull from Blackbull.'],
 ['接下來要打黑石巨人，先補等級與命中，並把鍛造技能升到 5 級，再開始備料。','The next steps involve Dark Stone Golems. Improve your level and accuracy and reach forging skill level 5 before preparing the materials.']]);
q(5,'perion','蓋房與旅行：製作材料','House & travel: crafted materials',[13],[
 ['勇士之村鍛造 1 個銀（成品）、10 個紫礦石（Orihalcon Ingot，成品），到武器製作台做 80 個螺絲。','In Perion, forge 1 Silver Ingot and 10 Orihalcon Ingots, then craft 80 Screws at the weapon station.'],
 ['魔法森林煉金台做 1 個鑽石、1 個黑水晶（Black Crystal），找艾溫做黑羽毛（Black Feather）。原稿未列各配方母礦量。','At the Ellinia alchemy station, make 1 Diamond and 1 Black Crystal, then make a Black Feather with Arwen. The source does not give ore quantities for these recipes.'],
 ['北部森林訓練場打風獨眼獸，收 1 張酋長地契（Blackbull\'s Deed to the Land）；弓箭手村木工台做 30 個加工木材。','Farm Curse Eyes in the northern tree dungeons for Blackbull\'s Deed to the Land. Craft 30 Processed Wood at the Henesys woodworking station.']]);
q(5,'sleepy','石巨人、黑石巨人與路克','Golems, Dark Stone Golems & Luke',[13],[
 ['石巨人寺院 I（Golem\'s Temple I）打石巨人、收 150 個石塊。奇幻村迷宮 V（Sleepy Dungeon V）打黑石巨人，收 50 個黑石塊、1 張古代卷軸（Ancient Scroll）。','At Golem\'s Temple I, collect 150 Stone Golem Rubble. At Sleepy Dungeon V, collect 50 Dark Stone Golem Rubble and 1 Ancient Scroll from Dark Stone Golems.'],
 ['帶材料回迷宮入口找路克完成 Luke the Security Guy\'s Wish to Travel。','Bring the materials to Luke at the dungeon entrance to complete Luke the Security Guy\'s Wish to Travel.']]);
q(5,'henesys','瑪亞後續收集、皮亞與酋長收尾','Maya collections, Pia & Blackbull cleanup',[13,14],[
 ['黃金海岸的熱沙地帶（Hot Sand）收 30 個烏龜殼；弓箭手村隱藏地圖肥肥公園 I／II（Pig Park I / II）收 30 個鋼鐵肥肥蹄。','At Hot Sand in Florina Beach, collect 30 Tortie Shells. At Pig Park I / II in Henesys, collect 30 Iron Hog\'s Metal Hooves.'],
 ['回瑪亞完成 Maya\'s Third Collection 與 Maya\'s Last Collection。找皮亞、麗娜完成 Pia\'s Present For a Friend，再回酋長交蓋房任務。','Complete Maya\'s Third Collection and Maya\'s Last Collection. Speak to Pia and Rina to finish Pia\'s Present For a Friend, then return to Blackbull for the house turn-in.'],
 ['勇士之村「舊軍刀」仍缺火焰羽毛掉落資料；PDF 未完成這一段，本站也保留為未收錄。','The PDF leaves the Old Saber quest unfinished because the fire-feather drop data is missing. That quest remains uncovered here too.']]);
q(6,'hollow','澤莉亞的地圖與黏著劑','Zelya\'s Map & Natural Adhesive',[14],[
 ['遺忘空洞找澤莉亞（Zelya）接 Zelya\'s Map。遺忘入口 III（Forgotten Entrance III）打發光菇（Glowshroom）、收 25 個地圖碎片。','Accept Zelya\'s Map in Forgotten Hollow. At Forgotten Entrance III, farm Glowshrooms for 25 Zelya\'s Map Fragments.'],
 ['回交任務、接 Natural Adhesive。遺忘入口 II 打 50 隻萊芙（Raffle）、收 25 個花瓣，回交後接 The Road Back Home，先保留。','Turn in and accept Natural Adhesive. At Forgotten Entrance II, defeat 50 Raffles and collect 25 Raffle Petals. Return, turn in, and keep The Road Back Home active.']],[['新區域中文名稱採說明暫譯，找目標時優先用英文；原稿未列最低等級。','Chinese names for the new area are provisional descriptions; use English to find targets. The source gives no minimum levels.']]);
q(6,'hollow','尼羅斯的希望與水螈','Nyroth\'s hope & Aqumanders',[14],[
 ['找尼羅斯（Nyroth）接 Nyroth\'s Fragile Hope。禁忌入口（Forbidden Entrance）打大王花（Rafflesia）、收 20 個花瓣。','Accept Nyroth\'s Fragile Hope. At Forbidden Entrance, collect 20 Rafflesia Petals.'],
 ['回尼羅斯交任務、接 Matters of the Heart。流光盡頭（The End of Fleeting Light）打 50 隻水螈（Aqumander）。','Return to Nyroth and accept Matters of the Heart. Defeat 50 Aqumanders at The End of Fleeting Light.']]);
q(6,'hollow','傑米與米拉：鐵的記憶','Jaime & Myra: A Memory of Iron',[14],[
 ['腐朽隧道 III（Decayed Tunnel III）找流浪探險家傑米（Jaime the Wandering Explorer）接 A Memory of Iron。下一張地圖 Lingering Regret 找米拉（Myra）接 Old Friends。','At Decayed Tunnel III, accept A Memory of Iron from Jaime the Wandering Explorer. At the next map, Lingering Regret, accept Old Friends from Myra.'],
 ['打 50 隻回音章魚（Echopus），回傑米交任務。米拉的後續仍要另外推進。','Defeat 50 Echopuses and turn in to Jaime. Myra\'s follow-up is still pending.']]);
q(6,'hollow','學者丹尼爾：木之心','Daniel the Scholar: stillness & wood',[14],[
 ['黑暗峭壁（Precipice of Darkness）找學者丹尼爾（Daniel the Scholar）接 A Heart of Stillness and Wood。','At Precipice of Darkness, accept A Heart of Stillness and Wood from Daniel the Scholar.'],
 ['打暮色螈（Duskmander）、收 20 個尾巴。回丹尼爾交任務、接 The Sage\'s Burden。','Collect 20 Duskmander Tails. Turn in to Daniel and accept The Sage\'s Burden.']]);
q(6,'hollow','新區域最後收尾','Finish the new-area route',[14],[
 ['另一處避難所（Another Sanctuary）打 30 隻孢子木（Sporewood），回 Lingering Regret 打 50 隻木喵（Myewood）。','Defeat 30 Sporewoods at Another Sanctuary, then 50 Myewoods at Lingering Regret.'],
 ['回米拉交 Old Friends、接 Myra\'s Old Friend，再回遺忘空洞找澤莉亞交任務。最後回魔法森林找漢斯交任務。','Turn in Old Friends to Myra and accept Myra\'s Old Friend. Return to Zelya in Forgotten Hollow, then to Grendel in Ellinia for the last turn-in.'],
 ['原稿稱「五個任務」，實際文字包含多組後續；此處按五組路線整理，不宣稱只有五個可接任務。','The PDF says "five quests" but describes multiple follow-ups. They are organized into five route groups here, not claimed to be exactly five individual quests.']]);

const differences=[
 ['範圍與版本','Scope & version','PDF：2026-09-27 初版，涵蓋 50 級前任務與新區域，部分建議 55 級回頭。貼文：30 級前流程，未提供日期。兩份都不是本站正式服實測。','PDF: initial edition dated 2026-09-27, covering pre-50 quests and the new area, with some cleanup suggested at 55. Transcript: an undated pre-30 route. Neither was live-tested by this site.'],
 ['路線不同，不等於門檻不同','Route timing is not a level requirement','PDF 以步行串城鎮、常把交件留到 30 級後；貼文一轉後繞島接任務、以勇士之村收尾。本站採 PDF 主線，另標貼文的提早接取時點。','The PDF connects towns on foot and delays many turn-ins until after 30. The transcript first loops the island and ends in Perion. This site uses the PDF route and labels earlier transcript pickups.'],
 ['材料可以留，但先接擊殺任務','Keep drops; accept kill quests first','PDF 說二測任務掉落較高、可提前留材料；貼文提醒很多任務仍需擊殺數。兩者可同時成立：保留材料，但未接任務的擊殺不保證計入。','The PDF reports higher test-version quest drop rates; the transcript warns that many quests also require kills. Both can be true: keep drops, but do not assume pre-quest kills count.'],
 ['樹枝、葉子與肥肥材料','Branches, leaves & Pig drops','樹枝：PDF 備 122，貼文 42。葉子：PDF 分階段列 30 與額外 65，貼文總 105。肥肥頭、蝴蝶結、羽毛也不同；材料表保留階段與來源，不產生假合計。','Branches: PDF reserve 122, transcript 42. Leaves: PDF lists 30 and an additional 65 by stage, transcript 105 total. Pig drops and feathers also differ. The material table retains stages and sources instead of inventing a combined total.'],
 ['化石目標怪物','Fossil monster targets','PDF：斧木妖的植物化石、綠菇菇段的動物化石。貼文：綠菇菇與黑木妖。這是內容衝突，請直接核對遊戲。','PDF: Plant Fossils from Axe Stumps and Animal Fossils during the Green Mushroom segment. Transcript: Green Mushrooms and Dark Stumps. This is a real conflict; check in-game.'],
 ['製作 NPC 與石榴石配方','Craft NPCs & Garnet recipe','PDF 用 Vicious／Francois／Silas Irons；貼文用比修斯／伊德／斯密斯。貼文寫石榴石 1 個母礦，PDF 留 11 個；不推定它們完全等價。','The PDF uses Vicious / Francois / Silas Irons; the transcript uses different Chinese names. The transcript describes a one-ore Garnet recipe; the PDF reserves 11 ore. Their equivalence is not assumed.'],
 ['化石研究耳環','Earrings for fossil research','PDF 明確寫 Weighted Earrings；貼文有垂耳環、鋼耳環、黃方耳環等說法。9000 楓幣購買是兩份都提到的備案，但物品名稱要確認。','The PDF specifies Weighted Earrings; the transcript uses several different Chinese earring names. Both mention a 9,000-meso purchase fallback, but the item must be checked.'],
 ['獎勵與機率','Rewards & probabilities','貼文的經驗、楓幣、卷軸、盾牌與卡蜜拉獎勵機率都有保留於對應步驟，但沒有第二來源交叉驗證，不能當成保證。','Transcript EXP, mesos, scrolls, shields, and Camila reward probabilities are retained in their related steps, but have no independent verification and are not guarantees.'],
 ['未完成與未涵蓋','Incomplete & excluded content','未含活動任務、完整每週捐獻、完整製作配方、完整忍耐跳法；舊軍刀掉落資料缺漏。瑞恩與伊卡路斯問答沒答案。PDF 的「製作鑽石母礦」疑似筆誤仍保留提醒。','Not covered: event quests, full weekly donations, full crafting recipes, platform-by-platform jump guides, or Old Saber drop data. Beginner and Icarus quiz answers are absent. The PDF\'s "craft Diamond Ore" wording is flagged as a possible error.'],
 ['官方語言、開放內容與日期','Official language, scope & dates','原稿對開服日期、中文支援與開放任務範圍的描述是當時資訊；本站不將它們當成最新官方公告。網站是玩家整理，非官方攻略。','Source statements about launch dates, Chinese support, and available quests describe their time of writing. This site does not present them as current official announcements. It is an unofficial player guide.']
].map(x=>({title:pair(x[0],x[1]),text:pair(x[2],x[3])}));

const materials=[];
function m(zh,en,quantity,stage,ref,noteZh,noteEn){materials.push({name:pair(zh,en),quantity,stage,ref,note:pair(noteZh,noteEn)});}
m('綠水靈珠','Slime Bubble','13',1,'q09','作業 3 個＋後續 10 個；離島訓練的 1 個另列於路線。','3 for homework + 10 later; the beginner training bubble is listed separately.');
m('黏液','Squishy Liquid','52',1,'q09','PDF 備料，含後續；貼文稱綠葉球。','PDF reserve including later uses; the transcript uses another Chinese name.');

ce:'來源',alias:'原稿別稱',plainNote:'數量與目標皆為原稿紀錄。'},
en:{skip:'Skip to guide',brand:'MapleStory Classic World · Field Notes',hero1:'Less wandering.',hero2:'More adventure.',heroDesc:'Two quest guides, one readable route. From your first job to the new area: know where to go, what to keep, and what to do next.',tag1:'Taiwan Chinese + English',tag2:'54 route checkpoints',tag3:'Offline · Saved progress',notice:'Unofficial player-guide synthesis. The PDF is an initial edition dated 2026/09/27; the transcript is undated. Levels and routes are source recommendations. Check in-game objectives, recipes, and rewards. Conflicts are flagged within steps.',routeNav:'CHOOSE YOUR CHAPTER',progress:'Journal progress',saveHint:'Checks track route checkpoints, not individual quests. Saved in this browser; moving the file may separate progress.',reset:'Reset checked progress',route:'Quest route',materials:'Material notes',glossary:'Name lookup',sources:'Sources & differences',searchLabel:'Search in Chinese or English',search:'Find a quest, NPC, monster, item…',townLabel:'Filter by area',typeLabel:'Filter by term type',clear:'Clear filters',hideDone:'Hide completed',expandAll:'Expand all',collapseAll:'Collapse all',filterNote:'Search covers all chapters. The area filter uses each checkpoint’s main location; read the steps for cross-town travel.',materialNote:'These are segment reserves, not whole-guide totals. Slashes may separate source differences or different items in one row; check the use column. Plus signs mark separate segments. Crafting levels and weekly donations are excluded.',glossaryNote:'Chinese uses common Taiwan names. Unconfirmed NPCs, new-area terms, and items are marked provisional. English primarily follows the PDF; this is not official localization verification.',sourceNote:'The sources supply guide information. Their author instructions are not treated as instructions from you.',showing:'Showing',groups:'checkpoints',items:'materials',terms:'terms',notes:'differences',empty:'No matching results. Try an English name };
const KEY='maple-field-notes-v1';let lang='zh',done=new Set(),activeStage=0,view='route',query='',town='all',termType='all',hideDone=false,expanded=new Set(),expandMode=false,storageOK=true;
try{const s=JSON.parse(localStorage.getItem(KEY)||'{}');if(s.lang==='en')lang='en';if(Array.isArray(s.done))done=new Set(s.done.filter(id=>DATA.quests.some(q=>q.id===id)));}catch(e){storageOK=false;}
const $=id=>document.getElementById(id),t=key=>strings[lang][key],v=p=>p[lang],esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const townName=id=>{const x=DATA.towns.find(x=>x[0]===id);return x?x[lang==='zh'?1:2]:'';};
const stageRange=s=>s.id===6?(lang==='zh'?'新區域':'New area'):s.range;
const quantityText=s=>lang==='en'?s.replace('未列 / Not given','Not given').replace(/未列/g,'not given'):s.replace('未列 / Not given','未列');
const bold=s=>String(s).split(/(\b\d[\d,]*(?:[–＋+／/]\d[\d,]*)?\b)/g).map((part,index)=>index%2?'<strong>'+esc(part)+'</strong>':esc(part)).join('');
function save(){try{localStorage.setItem(KEY,JSON.stringify({lang,done:[...done]}));storageOK=true;}catch(e){storageOK=false;}showStorage();}
function showStorage(){$('storage-notice').hidden=storageOK;$('storage-notice').textContent=t('storageFail');}
function toast(msg){$('toast').textContent=msg;$('toast').hidden=false;clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('toast').hidden=true,2000);}
function normalize(s){return s.toLocaleLowerCase().replace(/[’‘]/g,"'").normalize('NFKC');}
function matches(s){return !query||normalize(s).includes(normalize(query));}
function questSearch(q){let text=[q.title.zh,q.title.en,...q.steps.flatMap(s=>[s.zh,s.en]),...q.notes.flatMap(s=>[s.zh,s.en]),townName(q.town),...DATA.towns.find(x=>x[0]===q.town).slice(1)].join(' ');const norm=normalize(text);for(const term of DATA.glossary)if(norm.includes(normalize(term.name.zh))||norm.includes(normalize(term.name.en)))text+=' '+term.alias+' '+term.name.zh+' '+term.name.en;return text;}
const questIndex=new Map(DATA.quests.map(q=>[q.id,questSearch(q)]));
function renderShell(){document.documentElement.lang=lang==='zh'?'zh-Hant':'en';document.title=lang==='zh'?'楓之谷經典世界｜冒險手帳':'MapleStory Classic World | Field Notes';document.querySelectorAll('[data-i18n]').forEach(e=>e.textContent=t(e.dataset.i18n));document.querySelectorAll('[data-lang]').forEach(e=>{e.classList.toggle('active',e.dataset.lang===lang);e.setAttribute('aria-pressed',e.dataset.lang===lang);});$('search').placeholder=t('search');$('tabs').innerHTML=['route','materials','glossary','sources'].map((x,i)=>`<button data-view="${x}" class="${view===x?'active':''}" aria-current="${view===x?'page':'false'}"><span class="tab-number">0${i+1}</span>${t(x)}</button>`).join('');$('town').innerHTML=DATA.towns.map(x=>`<option value="${x[0]}">${esc(x[lang==='zh'?1:2])}</option>`).join('');$('town').value=town;$('term-type').innerHTML=['all','town','npc','monster','item'].map(x=>`<option value="${x}">${t(x==='all'?'allTypes':x+'Type')}</option>`).join('');$('term-type').value=termType;renderNav();renderProgress();renderContent();showStorage();}
function renderNav(){$('stage-nav').innerHTML=DATA.stages.map((s,i)=>`<button class="stage-button ${view==='route'&&activeStage===i&&!query?'active':''}" data-stage="${i}" ${view==='route'&&activeStage===i&&!query?'aria-current="step"':''}><span class="number">0${i+1}</span><span>${esc(v(s.title))}<small>${esc(i===6?t('newArea'):s.range+' · '+DATA.quests.filter(q=>q.stage===i&&done.has(q.id)).length+'/'+DATA.quests.filter(q=>q.stage===i).length)}</small></span></button>`).join('');}
function renderProgress(){const n=done.size,total=DATA.quests.length;$('progress-number').textContent=`${n} / ${total}`;$('progress-fill').style.width=`${100*n/total}%`;$('progressbar').setAttribute('aria-valuemax',total);$('progressbar').setAttribute('aria-valuenow',n);$('progressbar').setAttribute('aria-label',t('progress'));}
function empty(){return `<div class="empty">${t('empty')}<button data-action="restore">${t('restore')}</button></div>`;}
function renderContent(){const isRoute=view==='route',isGloss=view==='glossary',isSource=view==='sources';$('town').hidden=!isRoute;$('term-type').hidden=!isGloss;$('hide-label').hidden=!isRoute;$('expand-all').hidden=!isRoute;document.querySelector('.filters').hidden=isSource;$('filter-note').hidden=isSource;$('result-count').hidden=isSource;$('section-counter').textContent=isRoute?(query?'ALL':stageRange(DATA.stages[activeStage])):'0'+(['route','materials','glossary','sources'].indexOf(view)+1);$('section-title').textContent=isRoute?(query?t('allRoute'):v(DATA.stages[activeStage].title)):t(view);$('section-intro').textContent=isRoute?(query?t('resultsIntro'):v(DATA.stages[activeStage].intro)):t(view==='materials'?'materialIntro':view==='glossary'?'glossaryIntro':'sourcesIntro');$('filter-note').textContent=t(view==='materials'?'materialNote':view==='glossary'?'glossaryNote':'filterNote');$('expand-all').textContent=t(expandMode?'collapseAll':'expandAll');
if(isRoute)renderRoute();else if(view==='materials')renderMaterials();else if(isGloss)renderGlossary();else renderSources();}
function routeResults(){return DATA.quests.filter(q=>(query||q.stage===activeStage)&&(town==='all'||q.town===town)&&(!hideDone||!done.has(q.id))&&matches(questIndex.get(q.id)));}
function sourceFor(q){const pdf=q.pages.length?`${t('pdfPage')} ${q.pages.join(', ')}${t('pageUnit')}`:'';const hasText=q.extra||[...q.steps,...q.notes].some(s=>s.zh.includes('貼文'));return [pdf,hasText?t('transcript'):''].filter(Boolean).join(' · ');}
function renderRoute(){const rows=routeResults();$('result-count').textContent=`${t('showing')} ${rows.length} ${t('groups')}`;if(!rows.length){$('panel').innerHTML=empty();return;}let last=-1;$('panel').innerHTML=`<div class="route-list">${rows.map((q,index)=>{const open=expandMode||expanded.has(q.id)||(!query&&index===0&&!done.has(q.id));const group=query&&last!==q.stage?`<h3 class="section-marker">${esc(stageRange(DATA.stages[q.stage]))} · ${esc(v(DATA.stages[q.stage].title))}</h3>`:'';last=q.stage;return group+`<article class="quest-card ${done.has(q.id)?'done':''}" id="${q.id}"><div class="quest-top"><label class="complete-control"><input type="checkbox" data-complete="${q.id}" ${done.has(q.id)?'checked':''} aria-label="${esc(t('complete')+': '+v(q.title))}"></label><button class="quest-summary" data-toggle="${q.id}" aria-expanded="${open}" aria-controls="body-${q.id}"><span><span class="meta-line"><span>${q.id.slice(1).padStart(2,'0')}</span><span class="pill">${esc(townName(q.town))}</span>${q.extra?`<span class="pill extra">${t('extra')}</span>`:''}${done.has(q.id)?`<span data-done-status="true">${t('completed')} ✓</span>`:''}</span><h3>${esc(v(q.title))}</h3>${lang==='zh'?`<span class="subtitle" lang="en">${esc(q.title.en)}</span>`:''}</span><span class="chevron" aria-hidden="true">›</span></button></div><div class="quest-body" id="body-${q.id}" ${open?'':'hidden'}><ol>${q.steps.map(s=>`<li>${bold(v(s))}</li>`).join('')}</ol>${q.notes.length?`<aside class="variant"><b>${t('sourceDiff')}</b>${q.notes.map(n=>`<p>${esc(v(n))}</p>`).join('')}</aside>`:''}<div class="source-line"><span>${t('sourceLabel')}: ${esc(sourceFor(q))}</span><button data-source>${t('sourceDetails')}</button></div></div></article>`;}).join('')}</div>`;}
function renderMaterials(){const rows=DATA.materials.filter(x=>matches([x.name.zh,x.name.en,x.quantity,x.note.zh,x.note.en].join(' ')));$('result-count').textContent=`${t('showing')} ${rows.length} ${t('items')}`;$('panel').innerHTML=rows.length?`<div class="table-wrap" tabindex="0" role="region" aria-label="${esc(t('materials'))}"><table><thead><tr><th scope="col">${t('name')}</th><th scope="col">${t('quantity')}</th><th scope="col">${t('usage')}</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${esc(v(x.name))}${lang==='zh'?`<small lang="en">${esc(x.name.en)}</small>`:''}</td><td>${esc(quantityText(x.quantity))}</td><td>${esc(v(x.note))}<small>${esc(stageRange(DATA.stages[x.stage]))} · <button class="row-link" data-go="${x.ref}">${t('goStep')}</button></small></td></tr>`).join('')}</tbody></table></div>`:empty();}
function renderGlossary(){const rows=DATA.glossary.filter(x=>(termType==='all'||x.type===termType)&&matches(x.name.zh+' '+x.name.en+' '+x.alias));$('result-count').textContent=`${t('showing')} ${rows.length} ${t('terms')}`;$('panel').innerHTML=rows.length?`<div class="dictionary">${rows.map(x=>`<article class="term"><span>${t(x.type+'Type')}</span><b>${esc(lang==='zh'?x.name.zh:x.name.en)}</b>${lang==='zh'?`<small lang="en">${esc(x.name.en)}</small>`:''}${x.alias&&lang==='zh'?`<small>${t('alias')}：${esc(x.alias)}</small>`:''}</article>`).join('')}</div>`:empty();}
function renderSources(){$('panel').innerHTML=`<div class="source-grid"><article class="source-card"><span class="label">SOURCE A / PDF</span><h3>${t('pdfTitle')}</h3><p>${t('pdfDesc')}</p></article><article class="source-card"><span class="label">SOURCE B / TRANSCRIPT</span><h3>${t('textTitle')}</h3><p>${t('textDesc')}</p></article></div><div class="difference-list">${DATA.differences.map((d,i)=>`<article class="difference"><h3>${String(i+1).padStart(2,'0')} · ${esc(v(d.title))}</h3><p>${esc(v(d.text))}</p></article>`).join('')}</div><p class="links">${t('reference')}<br><a href="https://osmsdataexplorer.com" target="_blank" rel="noopener noreferrer">osmsdataexplorer.com ↗</a><a href="https://mscw-guidebook.com" target="_blank" rel="noopener noreferrer">mscw-guidebook.com ↗</a><a href="https://meowdb.com/msclassic/" target="_blank" rel="noopener noreferrer">meowdb.com/msclassic ↗</a></p>`;}
function clearFilters(){query='';town='all';termType='all';hideDone=false;$('search').value='';$('town').value='all';$('term-type').value='all';$('hide-done').checked=false;expandMode=false;renderShell();}
function goStage(n,scroll=true){activeStage=n;view='route';clearFilters();if(scroll) $('main').scrollIntoView({behavior:'auto',block:'start'});}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.lang){lang=b.dataset.lang;save();renderShell();}else if(b.dataset.view){view=b.dataset.view;clearFilters();}else if(b.dataset.stage!==undefined){goStage(Number(b.dataset.stage));}else if(b.dataset.toggle){const id=b.dataset.toggle;const body=$('body-'+id);const isOpen=b.getAttribute('aria-expanded')==='true';b.setAttribute('aria-expanded',!isOpen);body.hidden=isOpen;if(!isOpen)expanded.add(id);else expanded.delete(id);}else if(b.hasAttribute('data-source')){view='sources';renderShell();$('main').scrollIntoView({block:'start'});}else if(b.dataset.go){const q=DATA.quests.find(q=>q.id===b.dataset.go);if(!q)return;expanded.add(q.id);goStage(q.stage,false);$(q.id).scrollIntoView({block:'center'});$(q.id).querySelector('.quest-summary').focus({preventScroll:true});}else if(b.dataset.action==='restore'||b.id==='clear-filters'){clearFilters();}else if(b.id==='expand-all'){expandMode=!expandMode;if(!expandMode){expanded.clear();}renderContent();if(!expandMode){document.querySelectorAll('.quest-body').forEach(x=>x.hidden=true);document.querySelectorAll('.quest-summary').forEach(x=>x.setAttribute('aria-expanded','false'));}}else if(b.id==='reset'){$('reset-dialog').showModal();}else if(b.id==='cancel-reset'){$('reset-dialog').close();}else if(b.id==='confirm-reset'){done.clear();save();$('reset-dialog').close();renderShell();toast(t('resetDone'));}});
document.addEventListener('change',e=>{if(e.target.dataset.complete){const id=e.target.dataset.complete;e.target.checked?done.add(id):done.delete(id);save();renderProgress();renderNav();if(hideDone)renderContent();else{const card=$(id);card.classList.toggle('done',done.has(id));const line=card.querySelector('.meta-line');const status=line.querySelector('[data-done-status]');if(status)status.remove();if(done.has(id)){const s=document.createElement('span');s.dataset.doneStatus='true';s.textContent=t('completed')+' ✓';line.appendChild(s);}}}else if(e.target.id==='town'){town=e.target.value;renderContent();}else if(e.target.id==='term-type'){termType=e.target.value;renderContent();}else if(e.target.id==='hide-done'){hideDone=e.target.checked;renderContent();}});
$('search').addEventListener('input',e=>{query=e.target.value.trim();renderNav();renderContent();});
renderShell();
</script>
